name: flashlite-ci

on:
  push:
    branches: [main]
    paths:
      - "projects/04-flashlite/**"
      - ".github/workflows/ci-flashlite.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/04-flashlite/**"
      - ".github/workflows/ci-flashlite.yml"

defaults:
  run:
    working-directory: projects/04-flashlite

jobs:
  lint-test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/04-flashlite/pyproject.toml

      - name: Install CPU torch + package (no CUDA extension build on this runner)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate committed benchmark records against schema
        run: python scripts/validate_results.py --allow-empty

      - name: CPU-side tests (gpu-marked tests auto-skip via conftest)
        run: pytest -v
