name: forgelm-ci

on:
  push:
    branches: [main]
    paths:
      - "projects/01-forgelm/**"
      - ".github/workflows/ci-forgelm.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/01-forgelm/**"
      - ".github/workflows/ci-forgelm.yml"

defaults:
  run:
    working-directory: projects/01-forgelm

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/01-forgelm/requirements-lock.txt

      - name: Install CPU-safe locked dependencies
        run: |
          python -m pip install --upgrade pip
          sed \
            -e 's/^torch==2\.6\.0+cu124$/torch==2.6.0+cpu/' \
            -e '/^nvidia-/d' \
            -e '/^triton==/d' \
            requirements-lock.txt > requirements-lock.cpu.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.cpu.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (pyright)
        run: pyright

      - name: Unit + integration tests (CPU; GPU tests auto-skip on this runner)
        run: pytest -v
