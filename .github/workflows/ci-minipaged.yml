name: minipaged-ci

on:
  push:
    branches: [main]
    paths:
      - "projects/03-minipaged/**"
      - ".github/workflows/ci-minipaged.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/03-minipaged/**"
      - ".github/workflows/ci-minipaged.yml"

defaults:
  run:
    working-directory: projects/03-minipaged

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/03-minipaged/requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (pyright)
        run: pyright

      - name: Tests (unit + property + integration)
        run: pytest -v
