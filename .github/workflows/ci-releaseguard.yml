name: releaseguard-ci

on:
  push:
    branches: [main]
    paths:
      - "projects/08-releaseguard/**"
      - ".github/workflows/ci-releaseguard.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/08-releaseguard/**"
      - ".github/workflows/ci-releaseguard.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: projects/08-releaseguard

permissions:
  contents: read

jobs:
  test:
    name: Test demo-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: projects/08-releaseguard/demo-service/go.sum

      - name: go vet
        working-directory: projects/08-releaseguard/demo-service
        run: go vet ./...

      - name: go test (race + coverage)
        working-directory: projects/08-releaseguard/demo-service
        run: go test ./... -race -cover

  build-and-push:
    name: Build, scan and push immutable image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.summary.outputs.digest }}
      image_ref: ${{ steps.summary.outputs.image_ref }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/releaseguard-demo-service
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: projects/08-releaseguard/demo-service
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}
          build-args: |
            VERSION=sha-${{ steps.meta.outputs.sha_short }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}"

      - name: Record immutable image reference
        id: summary
        if: github.event_name == 'push'
        run: |
          DIGEST="$(docker inspect "${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}" --format '{{(index .RepoDigests 0)}}' | sed 's/^.*@//')"
          IMAGE_REF="${{ env.IMAGE }}@${DIGEST}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          {
            echo "### ReleaseGuard demo-service image"
            echo ""
            echo "- Tag: \`sha-${{ steps.meta.outputs.sha_short }}\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Immutable reference: \`$IMAGE_REF\`"
            echo "- Vulnerability scan: Trivy, CRITICAL/HIGH fixable findings gated the build (see the 'Scan image for vulnerabilities' step)"
          } >> "$GITHUB_STEP_SUMMARY"
