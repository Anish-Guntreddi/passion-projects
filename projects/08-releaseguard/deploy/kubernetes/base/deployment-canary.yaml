apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service-canary
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: canary
    release.releaseguard/track: canary
spec:
  # 1 canary replica alongside demo-service-stable's 2 gives a coarse ~33%
  # canary share of the shared Service's traffic (see service-shared.yaml
  # and ADR 0003) -- a real, observable split without adding a service
  # mesh or ingress-level weighted routing. Phase 3 is "manual canary":
  # a human (via deploy/local-cluster/canary-scenario.sh) decides when
  # this track looks unhealthy; nothing here scales replicas
  # automatically yet -- that lever is Phase 6's Kubernetes adapter.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-service
      app.kubernetes.io/instance: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-service
        app.kubernetes.io/instance: canary
        release.releaseguard/track: canary
      annotations:
        # Read by observability/prometheus's kubernetes_sd_configs
        # (role: pod) scrape config -- see that ConfigMap's comments. The
        # metrics endpoint itself already labels every series with
        # version/track (internal/server/metrics.go), so Prometheus only
        # needs to find and scrape the pod; it does not need to relabel
        # track/version from pod labels.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # No K8s credentials or service account tokens beyond the default
      # are needed by the demo-service itself; it never talks to the
      # Kubernetes API. automountServiceAccountToken is disabled to keep
      # its blast radius at zero even if it were ever compromised.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The distroless "nonroot" image variant sets its OCI USER as the
        # symbolic name "nonroot" (uid 65532), not a numeric UID. Kubelet's
        # runAsNonRoot verification cannot resolve a symbolic user against
        # the image config, so without an explicit numeric runAsUser here
        # it fails closed with CreateContainerConfigError ("image has
        # non-numeric user (nonroot), cannot verify user is non-root")
        # rather than risk silently running as root. 65532 is distroless's
        # documented nonroot UID/GID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-service
          image: releaseguard/demo-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RELEASE_TRACK
              value: "canary"
            # Deliberately a different value than the stable track's
            # v1.0.0 -- FR3 requires latency/errors/version to be
            # queryable *per stable/canary identity*, which this manifest
            # exercises end to end (RELEASE_VERSION -> /version and every
            # Prometheus series's `version` label -> PromQL filters like
            # http_requests_total{version="v1.1.0"}).
            - name: RELEASE_VERSION
              value: "v1.1.0"
            # Starts identical to the stable track's fault-injection
            # config (i.e. healthy) so a fresh `make cluster-up` produces
            # a healthy canary by default. Use
            # deploy/local-cluster/canary-scenario.sh to flip this track
            # to an unhealthy configuration on demand -- see that script
            # for why this is the deliberately manual (not automated)
            # lever Phase 3 calls for.
            - name: ERROR_RATE
              value: "0.0"
            - name: EXTRA_LATENCY_MS
              value: "0"
            - name: DEPENDENCY_DOWN
              value: "false"
            # Points at observability/otel's Collector Service. Trace
            # export is best-effort (internal/telemetry.NewTracerProvider
            # batches asynchronously and never blocks a request on it), so
            # this is safe to set even before the Collector is guaranteed
            # to be up yet -- see ADR 0009.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.releaseguard.svc.cluster.local:4318"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
