apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service-stable
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: stable
    release.releaseguard/track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-service
      app.kubernetes.io/instance: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-service
        app.kubernetes.io/instance: stable
        release.releaseguard/track: stable
    spec:
      # No K8s credentials or service account tokens beyond the default
      # are needed by the demo-service itself; it never talks to the
      # Kubernetes API. automountServiceAccountToken is disabled to keep
      # its blast radius at zero even if it were ever compromised.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The distroless "nonroot" image variant sets its OCI USER as the
        # symbolic name "nonroot" (uid 65532), not a numeric UID. Kubelet's
        # runAsNonRoot verification cannot resolve a symbolic user against
        # the image config, so without an explicit numeric runAsUser here
        # it fails closed with CreateContainerConfigError ("image has
        # non-numeric user (nonroot), cannot verify user is non-root")
        # rather than risk silently running as root. 65532 is distroless's
        # documented nonroot UID/GID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-service
          image: releaseguard/demo-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RELEASE_TRACK
              value: "stable"
            - name: RELEASE_VERSION
              value: "v1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
