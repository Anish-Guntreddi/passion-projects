apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Phase 2 (Telemetry): OTel Collector (traces) + Prometheus (metrics
  # scrape/query), deployed alongside the stable track by the same single
  # `make cluster-up` command -- see ADR 0009 and each directory's
  # kustomization.yaml/manifests for why they're split this way.
  - ../../../../observability/otel
  - ../../../../observability/prometheus

# Pin the image tag to what deploy/local-cluster/setup-cluster.sh builds
# and loads directly into the kind node via `kind load docker-image`. Kind
# never pulls from a registry for this tag, so imagePullPolicy: IfNotPresent
# (set in base/deployment.yaml) is what makes the locally-loaded image get
# used instead of triggering a (failing) remote pull.
images:
  - name: releaseguard/demo-service
    newTag: local
