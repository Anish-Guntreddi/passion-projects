# Example config for `forgelm sample-report --config configs/sample_report_example.yaml`
# (Phase 4). Fields map 1:1 to forgelm.config.SampleReportConfig.
#
# Run these first to produce the checkpoint this config points at:
#   forgelm tokenizer train --config configs/tokenizer_train.yaml
#   forgelm dataset build --config configs/dataset_build.yaml
#   forgelm train --config configs/train_toy.yaml
#
# `output_path` makes this config file sufficient on its own to reproduce
# the full artifact-producing run (FR1) -- writes
# `artifacts/reports/toy_sample_report.json` and `.md`. `artifacts/` is
# gitignored, so running this doesn't dirty the repo.
checkpoint_path: artifacts/checkpoints/final.pt
tokenizer_path: artifacts/tokenizer.json
output_path: artifacts/reports/toy_sample_report
val_tokens_path: artifacts/dataset/val_tokens.npy
prompts:
  - "Alice was beginning to"
  - "The Queen of Hearts"
  - "Down the rabbit-hole"
generation:
  max_new_tokens: 40
  temperature: 0.8
  top_k: 40
  do_sample: true
  seed: 1337
eval_batch_size: 8
device: cpu
