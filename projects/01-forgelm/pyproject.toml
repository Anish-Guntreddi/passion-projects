[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgelm"
version = "0.1.0"
description = "From-scratch decoder-only Transformer training stack (portfolio project 01)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anish Guntreddi" }]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
forgelm = "forgelm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: test requires a CUDA device (skipped automatically when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by the formatter, not the linter.
# B008: flags `typer.Option(...)` calls in default position, which is the
# standard (and only) way to declare Typer CLI options -- a false positive
# for this framework, same as the well-known FastAPI B008 exclusion.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["forgelm"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
