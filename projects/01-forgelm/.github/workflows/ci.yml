# NOTE ON LOCATION: GitHub Actions only discovers workflows under the
# *repository root*'s .github/workflows/. This portfolio's implementer
# agents are restricted to writing inside their own projects/<nn-name>/
# directory, so this file lives here (projects/01-forgelm/.github/workflows/ci.yml)
# for now and will not actually run until the orchestrator either:
#   (a) moves/copies it to the repo root's .github/workflows/ (recommended:
#       rename to ci-forgelm.yml alongside the other projects' workflows), or
#   (b) adds a root-level reusable-workflow wrapper that calls this one.
# See the implementer's final report for this flag. Every step below was
# additionally run locally in WSL (scripts/run_checks.sh) and its real
# output captured, so "CI green" is verified even though GitHub Actions
# itself has not executed this file yet.

name: forgelm-ci

on:
  push:
    branches: [main]
    paths:
      - "projects/01-forgelm/**"
  pull_request:
    paths:
      - "projects/01-forgelm/**"

defaults:
  run:
    working-directory: projects/01-forgelm

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (pyright)
        run: pyright

      - name: Unit + integration tests (CPU; GPU tests auto-skip on this runner)
        run: pytest -v
